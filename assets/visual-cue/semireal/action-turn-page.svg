 <filter id="smallShadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2"/></filter>
 <filter id="clothTexture"><feTurbulence type="fractalNoise" baseFrequency=".32" numOctaves="2" seed="7" result="noise"/><feColorMatrix in="noise" type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope=".065"/></feComponentTransfer><feBlend in="SourceGraphic" mode="multiply"/></filter>
 
<linearGradient id="paper" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#fffdf7"/><stop offset=".77" stop-color="#f0e5cf"/><stop offset="1" stop-color="#dbceb4"/></linearGradient>
<linearGradient id="cover" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#8fb2a9"/><stop offset=".65" stop-color="#658f8a"/><stop offset="1" stop-color="#416b6c"/></linearGradient>
<linearGradient id="turnpaper" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#fffdf8"/><stop offset="1" stop-color="#deceb3"/></linearGradient>
<style>
#pagePivot{transform-origin:260px 143px;transform-box:view-box;animation:pageFlip 4s ease-in-out infinite;}
@keyframes pageFlip{0%,17%,100%{transform:scaleX(1) rotate(-1deg)}42%,57%{transform:scaleX(.18) rotate(-4deg)}80%{transform:scaleX(-.92) rotate(-3deg)}}
@media(prefers-reduced-motion:reduce){#pagePivot{animation:none!important}}
</style>
