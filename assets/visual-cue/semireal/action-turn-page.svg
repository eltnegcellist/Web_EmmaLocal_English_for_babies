<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 390" role="img" aria-labelledby="visualTitle visualDesc">
<title id="visualTitle">絵本のページを一枚めくる</title><desc id="visualDesc">開いた厚紙絵本から右のページが背の綴じ目を支点に持ち上がり、左へ倒れてまた戻る。</desc>
<defs>
