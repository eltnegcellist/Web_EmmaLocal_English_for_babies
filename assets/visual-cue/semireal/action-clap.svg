<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 390" role="img" aria-labelledby="visualTitle visualDesc">
<title id="visualTitle">両手を合わせて拍手する</title><desc id="visualDesc">赤ちゃんの二本の腕と指がゆっくり中央で合わさり離れる。手だけが動く。</desc>
<defs>
