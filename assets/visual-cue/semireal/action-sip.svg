<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 390" role="img" aria-labelledby="visualTitle visualDesc">
<title id="visualTitle">哺乳瓶を飲む動き</title><desc id="visualDesc">赤ちゃんが横になり、乳首の付いた哺乳瓶を口元へ傾けてひと口飲む。哺乳瓶だけがゆっくり動く。</desc>
<defs>
 <linearGradient id="skin" x1="0" y1="0" x2="0.85" y2="1"><stop stop-color="#ffe8d5"/><stop offset=".42" stop-color="#f3c6a8"/><stop offset=".82" stop-color="#e8a981"/><stop offset="1" stop-color="#bd8068"/></linearGradient>
 <radialGradient id="cheek"><stop stop-color="#ef9091" stop-opacity=".6"/><stop offset="1" stop-color="#f59b93" stop-opacity="0"/></radialGradient>
 <linearGradient id="fabric" x1="0" y1="0" x2=".82" y2="1"><stop stop-color="#fffefa"/><stop offset=".63" stop-color="#e9e0db"/><stop offset="1" stop-color="#d1c6c2"/></linearGradient>
 <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ac7860"/><stop offset=".5" stop-color="#d0a486"/><stop offset="1" stop-color="#8e5e52"/></linearGradient>
 <linearGradient id="shadowBlue" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#e4f6fc"/><stop offset=".53" stop-color="#a4d4e1"/><stop offset="1" stop-color="#6baabf"/></linearGradient>
 <radialGradient id="background"><stop stop-color="#fffdf9"/><stop offset="1" stop-color="#f4e9e5"/></radialGradient>
 <filter id="castShadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="8"/></filter>
 <filter id="smallShadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2"/></filter>
 <filter id="clothTexture"><feTurbulence type="fractalNoise" baseFrequency=".32" numOctaves="2" seed="7" result="noise"/><feColorMatrix in="noise" type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope=".065"/></feComponentTransfer><feBlend in="SourceGraphic" mode="multiply"/></filter>
 
<linearGradient id="bottle" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#e2e8e8" stop-opacity=".83"/><stop offset=".19" stop-color="#fff" stop-opacity=".72"/><stop offset=".8" stop-color="#d4e4e8" stop-opacity=".7"/><stop offset="1" stop-color="#9cacb1" stop-opacity=".8"/></linearGradient>
<linearGradient id="milk" x1="0" y1="0" x2=".2" y2="1"><stop stop-color="#fffcf0"/><stop offset="1" stop-color="#f6deb7"/></linearGradient>
<style>
#bottlePivot{transform-origin:133px 234px;animation:bottleTip 3.4s ease-in-out infinite;}
@keyframes bottleTip{0%,13%,100%{transform:rotate(-9deg)}40%,68%{transform:rotate(3deg)}}
#lip{transform-origin:318px 214px;animation:lipMove 3.4s ease-in-out infinite;}
@keyframes lipMove{0%,18%,82%,100%{transform:scaleY(1)}42%,62%{transform:scaleY(.65)}}
@media(prefers-reduced-motion:reduce){#bottlePivot,#lip{animation:none!important}}
</style>
</defs>
