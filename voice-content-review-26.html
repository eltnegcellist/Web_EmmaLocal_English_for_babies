<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>みつことば・収録音声26件レビュー</title>
<style>
body{max-width:900px;margin:auto;padding:16px;font:16px/1.5 system-ui,sans-serif;background:#f7f8fa;color:#152235}
h1{font-size:1.5rem}article{background:white;padding:16px;margin:12px 0;border:1px solid #ddd;border-radius:12px}
small{color:#536278}audio{display:block;width:100%;margin-top:10px}select,textarea,button{font:inherit;padding:8px}
textarea{box-sizing:border-box;width:100%;height:55px;margin-top:8px}button{cursor:pointer}
q{font-weight:600}#progress{font-weight:700}pre{white-space:pre-wrap}
</style></head><body>
<h1>収録音声26件・実聴レビュー</h1>
<p>Whisper Small/Baseの自動認識と期待英文が食い違った候補です。自動照合での差分は、音源の発音間違いを証明しません。元音源を聞いて、必要に応じて判定してください。ページ上の操作はブラウザ内に保存され、送信されません。</p>
<p><button id="export">判定JSONを保存</button>　<span id="progress">読み込み中</span></p><div id="items"></div>
<script type="module">
const root=new URL('./',location.href);
const [audit,manifest]=await Promise.all([
 fetch(new URL('research/voice-content-26-review-20261015.json',root)).then(x=>{if(!x.ok)throw Error('review list fetch failed');return x.json()}),
 fetch(new URL('assets/voice-1202/manifest.json',root),{cache:'no-store'}).then(x=>{if(!x.ok)throw Error('manifest fetch failed');return x.json()})
]);
const byText=new Map(manifest.entries.map(e=>[e.text.trim().replace(/\s+/g,' '),e]));
const stored=JSON.parse(localStorage.getItem('voice-review-26-v1')||'{}');
const rootEl=document.getElementById('items');
function save(){localStorage.setItem('voice-review-26-v1',JSON.stringify(stored));const values=audit.entries.map(x=>stored[x.number]?.decision||'pending');const confirmed=values.filter(x=>x==='match'||x==='misread').length;const unclear=values.filter(x=>x==='unclear').length;const incorrect=values.filter(x=>x==='misread').length;document.getElementById('progress').textContent=confirmed+' / '+audit.entries.length+' 判定確定（判定不能 '+unclear+'件／再収録候補 '+incorrect+'件）';}
for(const item of audit.entries){
 const section=document.createElement('article'), heading=document.createElement('h2');
 heading.textContent='#'+item.number+' '+item.category;
 const expected=document.createElement('p');const q=document.createElement('q');q.textContent=item.expected;expected.append('期待英文：',q);
 const engine1=document.createElement('p');engine1.textContent='Whisper Small：'+item.whisperSmall;
 const engine2=document.createElement('p');engine2.textContent='Whisper Base：'+item.whisperBase;
 section.append(heading,expected,engine1,engine2);
 const entry=byText.get(item.expected.trim().replace(/\s+/g,' '));
 if(entry) {
  const audio=document.createElement('audio');audio.controls=true;audio.preload='none';
  audio.src=new URL('assets/voice-1202/'+entry.file,root).href;section.append(audio);
 }else {const p=document.createElement('p');p.textContent='音声一覧に該当英文がありません。対応IDの確認が必要です。';section.append(p);}
 const select=document.createElement('select');
 [['pending','未確認'],['match','期待英文どおり'],['misread','実際の発音が異なる'],['unclear','判定不能']].forEach(([value,label])=>{const opt=document.createElement('option');opt.value=value;opt.textContent=label;select.append(opt);});
 const note=document.createElement('textarea');note.placeholder='再収録が必要な単語など';note.value=stored[item.number]?.note||'';
 select.value=stored[item.number]?.decision||'pending';
 function change(){stored[item.number]={decision:select.value,note:note.value,expected:item.expected};save();}
 select.addEventListener('change',change);note.addEventListener('input',change);
 section.append(document.createElement('hr'),select,note);rootEl.append(section);
}
save();
document.getElementById('export').addEventListener('click',()=>{
 const decisions=audit.entries.map(x=>stored[x.number]?.decision||'pending');
 const complete=decisions.every(x=>x==='match'||x==='misread');
 const noRerecord=decisions.every(x=>x==='match');
 const json=JSON.stringify({source:'20261015 audio-review-26',reviewed_at:new Date().toISOString(),adjudication_complete:complete,audio_issues_resolved:noRerecord,results:stored},null,2);
 const anchor=document.createElement('a');anchor.href=URL.createObjectURL(new Blob([json],{type:'application/json'}));anchor.download='mitsukotoba-voice-content-review-26.json';anchor.click();URL.revokeObjectURL(anchor.href);
});
</script></body></html>
