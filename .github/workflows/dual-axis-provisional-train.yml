name: CooTrio dual-axis provisional training

on:
  push:
    branches: [research/dual-axis-corpus-v1]
    paths:
      - 'research/dual-axis-v1/**'
      - '.github/workflows/dual-axis-provisional-train.yml'
  pull_request:
    branches: [research/e5-locale-encoders-v1]
    paths:
      - 'research/dual-axis-v1/**'
      - '.github/workflows/dual-axis-provisional-train.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dual-axis-experiment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-research-train:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned research Python tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r research/e5-locale-encoders/requirements.txt
      - name: Rebuild and audit provisional dual-axis research corpus
        run: |
          python research/dual-axis-v1/build.py
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('research/dual-axis-v1/outputs/summary.json').read_text())
          assert s['starter_rows_kept']==1810, s
          assert s['human_and_native_reviewed_rows']==0, s
          assert s['by_axis']['both']==932,s
          print('Research corpus verified; original frozen benchmarks are excluded.')
          PY
      - name: Fit frozen-E5 shared and seven locale-specific Topic/Interaction heads
        run: |
          set -o pipefail
          python research/dual-axis-v1/train_heads.py --allow-unreviewed 2>&1 | tee research/dual-axis-v1/outputs/provisional_training.log
      - name: Assert research-only outputs exist and deployed model hashes are unchanged
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          out=Path('research/dual-axis-v1/outputs/provisional_heads')
          results=json.loads((out/'comparison.json').read_text())
          mani=json.loads((out/'run_manifest.json').read_text())
          assert len(results['by_language'])==7
          assert set(results['aggregate'])=={'baseline_v2','retrained_shared','retrained_locale','hybrid_v2topic_shared_interaction','hybrid_v2topic_locale_interaction'}
          assert mani['native_reviewed_rows']==0
          assert not mani['locked154_374_used_for_training_or_selection']
          assert len(list(out.glob('*.candidate.f32')))==16
          assert mani['status']=='EXPERIMENTAL_SYNTHETIC_NOT_PRODUCTION'
          print('Provisional training complete; nothing approved for production.')
          PY
          git diff --exit-code -- multilingual-assets/heads/
      - name: Save reproducible experiment and failed run diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cootrio-dual-axis-provisional-training-${{ github.run_id }}
          path: |
            research/dual-axis-v1/outputs/provisional_heads/
            research/dual-axis-v1/outputs/provisional_training.log
            research/dual-axis-v1/outputs/summary.json
            research/dual-axis-v1/outputs/excluded.json
          if-no-files-found: warn
          retention-days: 30
