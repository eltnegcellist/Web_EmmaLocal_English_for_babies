name: Emma Web CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: emma-web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Verify shared topic contract and generated help
        run: |
          python3 scripts/generate-lite-topic-contract.py --target web --check
          python3 scripts/test-lite-topic-contract.py
          python3 scripts/verify-play-topics.py
      - name: Verify pinned Semantic distribution assets
        run: python3 scripts/verify-semantic-assets.py
      - name: Smoke test LiteResponseEngine
        run: |
          node test-lite.mjs
          node test-topic-detection.mjs
          node test-avatar.mjs
          npm ci --ignore-scripts
          node test-features.mjs
          node test-semantic.mjs
      - name: Syntax check
        run: |
          node --check src/app.js
          for file in src/semantic/*.js; do node --check "$file"; done
          node --check src/conversation-history.js
          node --check src/feature-screens.js
          node --check src/app-navigation.js
          node --check src/resumable-download.js
          node --check src/audio-capture.js
          node --check src/asr-worker.js
          node --check src/tts-worker.js
          node --check src/vendor/moonshine/asset-downloader.js
          node --check src/vendor/kitten/model-loader.js
          node --check service-worker.js
          node --check src/lite-response-engine.js
          node --check src/lite-topic-matcher.js
          node --check src/lite-phonetic-scene-matcher.js
          node --check src/name-pronunciation.js
          node --check src/model-lab.js
      - name: Reject GPL/eSpeak runtime regressions
        run: |
          set -euo pipefail
          # These identifiers correspond to browser runtimes known to bundle or execute eSpeak NG.
          # Local src/vendor/kitten/phonemizer.js is allowed: it is the CMUDict-based implementation.
          banned='@mintplex-labs/piper-tts-web|createPiperPhonemize|espeak-ng-data|kokoro-js|phonemizer@'
          if grep -RniE "$banned" index.html model-lab.html src service-worker.js \
              --exclude='THIRD_PARTY_NOTICES.md' --exclude='LICENSE_AUDIT.md'; then
            echo "GPL/eSpeak runtime regression detected."
            exit 1
          fi

  publish:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Fast-forward Pages source branch
        run: |
          set -euo pipefail
          git push origin HEAD:chore/trigger-pages
          remote_sha="$(git ls-remote origin refs/heads/chore/trigger-pages | cut -f1)"
          test "$remote_sha" = "$GITHUB_SHA"
