name: Emma Web CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: emma-web-ci
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Smoke test LiteResponseEngine
        run: node test-lite.mjs
      - name: Syntax check
        run: |
          node --check src/app.js
          node --check src/audio-capture.js
          node --check src/asr-worker.js
          node --check src/tts-worker.js
          node --check src/lite-response-engine.js
          node --check src/name-pronunciation.js
          node --check src/model-lab.js

  publish:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Fast-forward Pages source branch
        run: |
          set -euo pipefail
          git push origin HEAD:chore/trigger-pages
          remote_sha="$(git ls-remote origin refs/heads/chore/trigger-pages | cut -f1)"
          test "$remote_sha" = "$GITHUB_SHA"
