name: Emma Web CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: emma-web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Verify shared topic contract and generated help
        run: |
          python3 scripts/generate-lite-topic-contract.py --target web --check
          python3 scripts/test-lite-topic-contract.py
          python3 scripts/verify-play-topics.py
      - name: Verify bundled Silero model and license
        run: python3 scripts/verify-silero-assets.py
      - name: Verify pinned Semantic distribution assets
        run: python3 scripts/verify-semantic-assets.py
      - name: Smoke test LiteResponseEngine
        run: |
          node test-lite.mjs
          node test-topic-detection.mjs
          node test-avatar.mjs
          npm ci --ignore-scripts
          node test-features.mjs
          node test-semantic.mjs
          node test-interaction.mjs
          node test-silero.mjs
          node test-interruptible-turn.mjs

      - name: Verify adopted voice coverage, cache and audio integrity
        run: |
          node test-asr-keyterm-bias.mjs
          node scripts/test-recorded-review-26.mjs
          node test-prerecorded-voice.mjs
          node test-tts-prerecorded.mjs
          npm run verify:voice
      - name: CMUdict phoneme audit of all English release candidates
        run: |
          python3 -m pip install 'cmudict==1.1.3'
          python3 scripts/audit-phonemes.py
          python3 -c "import cmudict; from pathlib import Path; Path('/tmp/mitsukotoba-cmudict.txt').write_text(cmudict.raw())"
          CMU_DICT_FILE=/tmp/mitsukotoba-cmudict.txt node scripts/check-kitten-phonemes.mjs
      - name: Classify all 914 infant-directed English sets
        run: |
          node scripts/review-infant-english.mjs --check
          node scripts/review-infant-english.mjs
      - name: Archive complete English naturalness ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: infant-english-review-914
          path: |
            docs/english/INFANT_ENGLISH_REVIEW_914.md
            docs/english/infant-english-review.json
          if-no-files-found: warn
          retention-days: 30
      - name: Archive text-phoneme audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lite-phoneme-audit
          path: |
            docs/english/PHONEME_AUDIT_REPORT.md
            docs/english/phoneme-audit.json
          if-no-files-found: warn
          retention-days: 14
      - name: Test actual Silero WASM inference and Settings rollback
        run: |
          npx playwright install --with-deps chromium
          VAD_BROWSER_CHANNEL=chromium npm run test:vad-browser
      - name: Screenshot 12 Visual Cue prototypes (desktop and mobile)
        run: node scripts/browser-visual-cue-prototypes.mjs
      - name: Check Emma face illustration setting in actual Web app
        run: node scripts/browser-visual-cue-live.mjs
      - name: Archive Visual Cue prototype screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-cue-prototype-screenshots
          path: .visual-cue-results/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
      - name: Run actual Web Semantic inference parity baseline
        run: node scripts/semantic-parity-web.mjs --output .semantic-parity/web.json
      - name: Probe real Ruri Topic and Interaction heads without keyword rules
        run: node scripts/evaluate-ruri-two-axes.mjs
      - name: Sweep generic-only rescue thresholds (research, no shipping changes)
        run: node scripts/experiment-ruri-generic-rescue.mjs
      - name: Archive exploratory generic-rescue sweep
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruri-generic-rescue-sweep
          path: .semantic-parity/ruri-generic-rescue-sweep.json
          if-no-files-found: warn
          retention-days: 14
      - name: Upload exploratory Ruri two-axis accuracy probes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruri-two-axis-qa-probes
          path: .semantic-parity/ruri-qa-20261013.json
          if-no-files-found: warn
          retention-days: 7
      - name: Syntax check
        run: |
          node --check src/app.js
          for file in src/semantic/*.js; do node --check "$file"; done
          node --check src/conversation-history.js
          node --check src/feature-screens.js
          node --check src/app-navigation.js
          node --check src/resumable-download.js
          node --check src/silero-capture.js
          node --check src/silero-endpoint.js
          node --check src/silero-worker.js
          node --check scripts/browser-silero-smoke.mjs
          node --check src/audio-capture.js
          node --check src/asr-worker.js
          node --check src/asr-client.js
          node --check src/turn-revisions.js
          node --check src/tts-worker.js
          node --check src/vendor/moonshine/asset-downloader.js
          node --check src/vendor/kitten/model-loader.js
          node --check service-worker.js
          node --check src/lite-response-engine.js
          node --check src/lite-topic-matcher.js
          node --check src/lite-phonetic-scene-matcher.js
          node --check src/model-lab.js
          node --check scripts/semantic-parity-web.mjs
      - name: Reject GPL/eSpeak runtime regressions
        run: |
          set -euo pipefail
          # These identifiers correspond to browser runtimes known to bundle or execute eSpeak NG.
          # Local src/vendor/kitten/phonemizer.js is allowed: it is the CMUDict-based implementation.
          banned='@mintplex-labs/piper-tts-web|createPiperPhonemize|espeak-ng-data|kokoro-js|phonemizer@'
          if grep -RniE "$banned" index.html model-lab.html src service-worker.js \
              --exclude='THIRD_PARTY_NOTICES.md' --exclude='LICENSE_AUDIT.md'; then
            echo "GPL/eSpeak runtime regression detected."
            exit 1
          fi

  publish:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Fast-forward Pages source branch
        run: |
          set -euo pipefail
          git push origin HEAD:chore/trigger-pages
          remote_sha="$(git ls-remote origin refs/heads/chore/trigger-pages | cut -f1)"
          test "$remote_sha" = "$GITHUB_SHA"
