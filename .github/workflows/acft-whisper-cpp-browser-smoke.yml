name: ACFT Small whisper.cpp WASM browser smoke (experimental)
on:
  push:
    branches:
      - experiment/whisper-stage-profile-20261023
    paths:
      - 'whisper-acft-cached-benchmark.html'
      - 'experimental/whisper-acft-wasm/test-page.js'
      - 'scripts/browser-whisper-acft-wasm-smoke.mjs'
      - '.github/workflows/acft-whisper-cpp-browser-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Install Chrome for Playwright
        run: npx playwright install --with-deps chromium
      - name: Start experiment browser test
        run: |
          test -s experimental/whisper-acft-wasm/runtime/main.js
          node --check experimental/whisper-acft-wasm/test-page.js
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/acft-cpp-browser.log 2>&1 &
          ACFT_CPP_TEST_ORIGIN=http://127.0.0.1:8765 node scripts/browser-whisper-acft-wasm-smoke.mjs
