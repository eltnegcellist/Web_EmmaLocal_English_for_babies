name: CooTrio E5 Interaction v3 research

on:
  push:
    branches:
      - research/e5-interaction-v3-actions
    paths:
      - .github/workflows/e5-interaction-v3-research.yml
      - research/e5-interaction-v3/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e5-interaction-v3-research-${{ github.ref }}
  cancel-in-progress: false

jobs:
  train-and-compare:
    name: Research only - train and compare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out frozen branch revision
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: research/e5-interaction-v3/requirements.txt
      - name: Install research-only Python requirements
        run: python -m pip install -r research/e5-interaction-v3/requirements.txt
      - name: Verify and unpack training and locked diagnostic data
        run: python research/e5-interaction-v3/scripts/unpack_data.py
      - name: Freeze runtime package inventory
        run: |
          mkdir -p research/e5-interaction-v3/outputs/research-only
          python -m pip freeze > research/e5-interaction-v3/outputs/research-only/python-packages.txt
      - name: Train E5 Interaction head and compare with checked-out baseline
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          HF_HUB_DOWNLOAD_TIMEOUT: '120'
        run: |
          python research/e5-interaction-v3/scripts/train_interaction.py \
            --allow-unreviewed --threads 2 \
            --out research/e5-interaction-v3/outputs/research-only
      - name: Verify outputs and forbid production-head modification
        run: |
          python research/e5-interaction-v3/scripts/verify_outputs.py
          git diff --exit-code -- multilingual-assets/heads/
      - name: Upload research artifacts (even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cootrio-e5-interaction-v3-research-${{ github.run_id }}
          path: research/e5-interaction-v3/outputs/research-only/
          if-no-files-found: warn
          retention-days: 30
