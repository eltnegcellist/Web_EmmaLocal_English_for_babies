name: Visual Cue corpus checks
on:
  pull_request:
    paths:
      - 'shared/visual-cue-*.json'
      - 'assets/visual-cue/**'
      - 'visual-cue-prototypes.*'
      - 'src/visual-cue-prototype-preview.js'
      - 'scripts/test-visual-cue-svg.py'
      - 'scripts/browser-visual-cue-prototypes.mjs'
      - 'scripts/*visual-cue*.mjs'
      - '.github/workflows/visual-cue-corpus.yml'
      - 'src/lite-response-engine.js'
      - 'src/interaction/**'
      - 'shared/play-topics.json'
  push:
    branches: [main]
    paths:
      - 'shared/visual-cue-*.json'
      - 'scripts/*visual-cue*.mjs'
      - '.github/workflows/visual-cue-corpus.yml'
      - 'src/lite-response-engine.js'
      - 'src/interaction/**'
      - 'shared/play-topics.json'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/build-visual-cue-data.mjs --check
      - run: node scripts/test-visual-cue-data.mjs
      - run: node scripts/validate-visual-cue-data.mjs
      - run: node scripts/build-visual-cue-assets.mjs --check
      - run: node scripts/audit-visual-cue-semantics.mjs --check
      - run: node scripts/test-visual-cue-semantics.mjs
      - run: node scripts/test-visual-cue-prototypes.mjs
