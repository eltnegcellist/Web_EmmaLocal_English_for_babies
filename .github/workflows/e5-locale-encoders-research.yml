name: CooTrio locale-specific encoder comparison

on:
  push:
    branches: [research/e5-locale-encoders-v1]
    paths:
      - '.github/workflows/e5-locale-encoders-research.yml'
      - 'research/e5-locale-encoders/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: locale-encoders-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compare:
    name: Compare E5 and locale model (${{ matrix.lang }})
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        lang: [en, de, fr, ko, th, zh, hi]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: research/e5-locale-encoders/requirements.txt
      - name: Install pinned research-only packages
        run: python -m pip install -r research/e5-locale-encoders/requirements.txt
      - name: Verify/unpack frozen v3 research corpus
        run: python research/e5-interaction-v3/scripts/unpack_data.py
      - name: Record environment
        run: |
          mkdir -p research/e5-locale-encoders/outputs/${{ matrix.lang }}
          python -m pip freeze > research/e5-locale-encoders/outputs/${{ matrix.lang }}/python-packages.txt
      - name: Compare identical validation and held-out texts, without changing production
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          HF_HUB_DOWNLOAD_TIMEOUT: '180'
          OMP_NUM_THREADS: '2'
          TOKENIZERS_PARALLELISM: 'false'
        run: |
          python research/e5-locale-encoders/benchmark.py --lang '${{ matrix.lang }}' --allow-unreviewed
      - name: Assert production heads were not modified
        if: always()
        run: git diff --exit-code -- multilingual-assets/heads/
      - name: Upload comparison and per-example predictions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: locale-e5-interaction-${{ matrix.lang }}-${{ github.run_id }}
          path: research/e5-locale-encoders/outputs/${{ matrix.lang }}/
          if-no-files-found: warn
          retention-days: 30
