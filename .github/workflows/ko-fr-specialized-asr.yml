name: Korean French specialized ASR to E5 benchmark

on:
  push:
    branches: [research/asr-ko-fr-alternatives-v1]
    paths:
      - '.github/workflows/ko-fr-specialized-asr.yml'
      - 'research/asr-ko-fr-alternatives/**'
  pull_request:
    branches: [research/asr-e5-vs-ruri-v1]
    paths:
      - '.github/workflows/ko-fr-specialized-asr.yml'
      - 'research/asr-ko-fr-alternatives/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ko-fr-specialist-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-voices:
    strategy:
      fail-fast: false
      matrix:
        lang: [ko, fr]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Moonshine TTS and resampling
        run: |
          python -m pip install moonshine-voice numpy==1.26.4 scipy==1.14.1
      - name: Generate 22 audio clips for identical ASR inputs per language
        run: |
          set -o pipefail
          python research/asr-ko-fr-alternatives/make_audio.py --lang ${{ matrix.lang }} 2>&1 | tee moonshine-tts-${{ matrix.lang }}.log
      - name: Upload frozen synthetic clips and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audio-${{ matrix.lang }}
          path: |
            research/asr-ko-fr-alternatives/outputs/${{ matrix.lang }}/
            moonshine-tts-${{ matrix.lang }}.log
          retention-days: 14
          if-no-files-found: warn

  models:
    needs: synthetic-voices
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - lang: ko
            model: baseline-ko
          - lang: ko
            model: ko-specialist
          - lang: fr
            model: baseline-fr
          - lang: fr
            model: fr-specialist-small
          - lang: fr
            model: fr-specialist-medium
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU torch and pinned ASR/E5 dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.6.0'
          python -m pip install 'transformers==4.57.1' 'accelerate==1.11.0' 'huggingface-hub<1.0' 'numpy==1.26.4' 'scikit-learn==1.8.0' 'onnxruntime==1.31.0' 'tokenizers==0.22.1' 'sentencepiece'
      - name: Download the SAME synthetic audio generated by language job
        uses: actions/download-artifact@v4
        with:
          name: audio-${{ matrix.lang }}
          path: /tmp/cootrio-audio
      - name: Download frozen E5 classifier heads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/cootrio-heads
          gh run download 40073281853 --repo "$GITHUB_REPOSITORY" --name cootrio-dual-axis-provisional-training-40073281853 --dir /tmp/cootrio-heads
          test -f /tmp/cootrio-heads/provisional_heads/candidate_manifest.json
      - name: Compare ASR model with frozen E5 Topic and Interaction heads
        run: |
          set -o pipefail
          python research/asr-ko-fr-alternatives/score_asr.py --model '${{ matrix.model }}' --audio-dir '/tmp/cootrio-audio/research/asr-ko-fr-alternatives/outputs/${{ matrix.lang }}' --candidate-heads /tmp/cootrio-heads/provisional_heads 2>&1 | tee research-${{ matrix.model }}.log
      - name: Preserve each outcome, even if download or inference fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ko-fr-asr-${{ matrix.model }}-${{ github.run_id }}
          path: |
            research/asr-ko-fr-alternatives/outputs/${{ matrix.model }}/
            research-${{ matrix.model }}.log
          retention-days: 14
          if-no-files-found: warn
