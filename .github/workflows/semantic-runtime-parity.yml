name: Semantic Runtime Parity

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'src/semantic/**'
      - 'src/semantic-assets-manifest.json'
      - 'semantic-assets/**'
      - 'shared/semantic-parity-cases.json'
      - 'scripts/semantic-parity-web.mjs'
      - '.github/workflows/semantic-runtime-parity.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/semantic/**'
      - 'src/semantic-assets-manifest.json'
      - 'semantic-assets/**'
      - 'shared/semantic-parity-cases.json'
      - 'scripts/semantic-parity-web.mjs'
      - '.github/workflows/semantic-runtime-parity.yml'

permissions:
  contents: read

concurrency:
  group: web-semantic-runtime-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Web
        uses: actions/checkout@v6

      - name: Checkout Android parity host
        uses: actions/checkout@v5
        with:
          repository: eltnegcellist/Android_English_character_for_baby
          ref: main
          path: .android-parity

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
          cache-disabled: true

      - name: Compare actual Web and Android Semantic inference
        shell: bash
        run: |
          set -euo pipefail
          echo "Web parity revision: $GITHUB_SHA"
          echo "Android parity revision: $(git -C .android-parity rev-parse HEAD)"
          node scripts/semantic-parity-web.mjs --output .semantic-parity/web.json
          WEB_ROOT="$PWD"
          gradle -p .android-parity --no-daemon :semantic-parity-host:run --stacktrace --args="--web $WEB_ROOT/.semantic-parity/web.json --model $WEB_ROOT/semantic-assets/ruri70-int8-bd500193/model.onnx --tokenizer $WEB_ROOT/semantic-assets/ruri70-int8-bd500193/tokenizer.json --head $WEB_ROOT/semantic-assets/ruri70-int8-bd500193/head-topic.f32 --output $WEB_ROOT/.semantic-parity/android-vs-web.json"
          cat .semantic-parity/android-vs-web.json

      - name: Upload Semantic parity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semantic-runtime-parity
          path: .semantic-parity/android-vs-web.json
          if-no-files-found: warn
          retention-days: 2
