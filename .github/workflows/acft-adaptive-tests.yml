name: Adaptive ACFT multilingual tests (experimental)
on:
  push:
    branches: [experiment/multilingual-acft-adaptive-20261024]
    paths:
      - 'src/multilingual/**'
      - 'src/app.js'
      - 'package.json'
      - 'test-acft-multilingual.mjs'
      - 'test-multilingual.mjs'
      - 'scripts/browser-acft-adaptive-smoke.mjs'
      - 'multilingual-assets/runtime/acft-whispercpp.js'
      - '.github/workflows/acft-adaptive-tests.yml'
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: acft-adaptive-multilingual-tests
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Test model-selection, all windows, and multilingual UI
        run: |
          node --check src/multilingual/acft-native-worker.js
          node --check src/multilingual/acft-client.js
          node --check src/app.js
          node test-acft-multilingual.mjs
          node test-multilingual.mjs
          node test-ui-localization.mjs
      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium
      - name: Smoke-test native worker startup without private audio or model
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/acft-smoke-server.log 2>&1 &
          ACFT_ORIGIN=http://127.0.0.1:8765 node scripts/browser-acft-adaptive-smoke.mjs
