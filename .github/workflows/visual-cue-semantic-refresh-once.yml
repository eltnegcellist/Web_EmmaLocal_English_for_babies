name: Visual Cue one-time semantic refresh
# Retry after asset-plan catalog binding fix.
on:
  push:
    branches: [feature/visual-cue-semantic-audit-20261014]
    paths:
      - '.github/workflows/visual-cue-semantic-refresh-once.yml'
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate 914 assignments, assets and semantic audit
        run: |
          node scripts/build-visual-cue-data.mjs
          node scripts/build-visual-cue-assets.mjs
          node scripts/audit-visual-cue-semantics.mjs
          node scripts/test-visual-cue-data.mjs
          node scripts/validate-visual-cue-data.mjs
          node scripts/test-visual-cue-semantics.mjs
      - name: Commit generated data
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shared/visual-cue-assignments.draft.json shared/visual-cue-phrases.json shared/visual-cue-corpus.snapshot.json shared/visual-cue-namespaces.json shared/visual-cue-asset-plan.json shared/visual-cue-semantic-audit.json
          if git diff --cached --quiet; then
            echo "Generated artifacts unchanged"
          else
            git commit -m "chore(visual-cue): synchronize reviewed cues and reusable visual asset plan"
            git push origin HEAD:feature/visual-cue-semantic-audit-20261014
          fi
