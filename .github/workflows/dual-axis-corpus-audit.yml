name: Dual-axis corpus schema and leakage audit

on:
  push:
    branches: [research/dual-axis-corpus-v1]
    paths:
      - '.github/workflows/dual-axis-corpus-audit.yml'
      - 'research/dual-axis-v1/**'
  pull_request:
    branches: [research/e5-locale-encoders-v1]
    paths:
      - '.github/workflows/dual-axis-corpus-audit.yml'
      - 'research/dual-axis-v1/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate native synthetic seeds and read-only frozen test exclusion
        run: |
          python -m py_compile research/dual-axis-v1/build.py
          python research/dual-axis-v1/build.py
      - name: Assert both axes and all seven languages are represented
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          output=Path('research/dual-axis-v1/outputs')
          s=json.loads((output/'summary.json').read_text())
          c=json.loads((output/'coverage.json').read_text())
          assert s['classification_axes']=={'topic':22,'interaction':15,'label_total':37,'theoretical_pairs':330}
          assert set(c)=={'en','de','fr','ko','th','zh','hi'}
          assert s['human_and_native_reviewed_rows']==0
          queue=(output/'needs_review_queue.jsonl').read_text(encoding='utf-8').splitlines()
          assert len(queue)==7*(22+15),len(queue)
          assert all(json.loads(line)['required_additional_reviewed_families']==50 for line in queue)
          assert 1750<=s['starter_rows_kept']<=1812,s
          assert s['by_axis']['topic']==308 and s['by_axis']['interaction']==570,s
          assert s['by_axis']['both']>=900,s
          assert s['paired_dual_axis_contrasts_imported']==486,s
          assert s['excluded_overlap_or_duplicate']==1816-s['starter_rows_kept'],s
          assert s['remaining_topic_dual_axis_contrasts_imported']>=300,s
          assert s['remaining_interaction_dual_axis_contrasts_imported']>=100,s
          excluded=json.loads((output/'excluded.json').read_text())
          print('Excluded overlapping/duplicated research utterances:',excluded)
          assert len(excluded)==s['excluded_overlap_or_duplicate']
          assert s['ready_for_production'] is False
          for lang,axes in c.items():
              assert len(axes['topic'])==22 and len(axes['interaction'])==15
              for axis,labels in axes.items():
                  assert all(item['utterances']>=1 for item in labels.values()),(lang,axis)
          corpus=[json.loads(row) for row in (output/'starter_corpus.jsonl').read_text().splitlines() if row]
          split_groups={}
          for r in corpus:
              if r.get('contrast_group'):
                  split_groups.setdefault(r['contrast_group'],set()).add(r['split'])
          assert len(split_groups)==22, len(split_groups)
          assert all(len(v)==1 for v in split_groups.values()),split_groups
          assert len([r for r in corpus if r.get('supervision_axis')=='both'])==s['by_axis']['both']
          intended_intents=set(json.loads(Path('multilingual-assets/heads/config.json').read_text())['heads']['interaction']['classes'])
          paired_intents={r['interaction'] for r in corpus if r.get('supervision_axis')=='both'}
          assert paired_intents==intended_intents,(paired_intents,intended_intents)
          expected_topics=set(json.loads(Path('multilingual-assets/heads/config.json').read_text())['heads']['topic']['classes'])
          assert {r['topic'] for r in corpus if r.get('supervision_axis')=='both'}==expected_topics
          assert len({r['semantic_family'] for r in corpus if r.get('supervision_axis')=='both'})>=125

          print('All 22 cross-language scene groups have disjoint train/validation assignment.')
          print('Seed QA passed; no generated data is marked production-ready.')
          PY
      - name: Prepare independent blinded language review packets
        run: |
          python research/dual-axis-v1/prepare_review.py
          python research/dual-axis-v1/merge_reviews.py
      - name: Assert unlabeled drafts cannot be auto-certified
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('research/dual-axis-v1/outputs')
          manifest=json.loads((root/'reviewer_packets/manifest.json').read_text())
          outcome=json.loads((root/'review_merge/summary.json').read_text())
          assert manifest['rows']>=1750,manifest
          assert manifest['packet_files']==14
          assert manifest['auto_approved']==0
          assert outcome['accepted']==0,outcome
          assert outcome['statuses']=={'incomplete':manifest['rows']},outcome
          assert len((root/'review_merge/needs_adjudication.jsonl').read_text().splitlines())==manifest['rows']
          print('Blind review packets valid. No synthetic seed was auto-approved.')
          PY
      - name: No changes to deployed heads
        run: git diff --exit-code -- multilingual-assets/heads
      - name: Upload research starter and quality gaps
        uses: actions/upload-artifact@v4
        with:
          name: cootrio-dual-axis-starter-${{ github.run_id }}
          path: research/dual-axis-v1/outputs/
          if-no-files-found: error
          retention-days: 30
