name: Visual Cue raster artwork review
on:
  pull_request:
    paths:
      - 'assets/visual-cue/artwork/**'
      - 'scripts/visual-cue/**'
      - '.github/workflows/visual-cue-artwork.yml'
      - 'assets/emma-gestures/**'
      - 'assets/emma-background-cues/**'
      - 'assets/visual-cue/motion-variants/**'
      - 'assets/visual-cue/prototypes/hug-face/**'
      - 'visual-cue-hug-face.html'
      - 'src/emma-background-cues.js'
      - 'src/emma-preview-motion.js'
      - 'src/visual-cue-*.js'
      - 'src/emma-gestures.js'
      - 'visual-cue-ui-preview.html'
      - 'test-visual-cue-ui.mjs'
      - 'shared/visual-cue-runtime-review.json'
      - 'shared/visual-cue-ui-examples.json'
      - 'shared/visual-cue-coverage*'
      - 'shared/visual-cue-trial-data.json'
      - 'visual-cue-test.html'
      - 'visual-cue-trial.css'
      - 'visual-cue-coverage.*'
      - 'test-visual-cue-coverage.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  raster-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/visual-cue/requirements.txt
      - run: python scripts/verify-visual-cue-handoff.py
      - run: python scripts/visual-cue/audit_scene_usage.py
      - run: python scripts/visual-cue/audit_r3_usage.py
      - run: python scripts/visual-cue/validate_artwork.py
      - run: python scripts/visual-cue/report_artwork.py
      - run: python scripts/visual-cue/export_preview.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Capture standalone review, controls and reduced motion
        run: |
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/visual-cue-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          python scripts/visual-cue/prepare_pages.py --output dist/visual-cue-full-app
          node scripts/visual-cue/test_live_app_storage.mjs dist/visual-cue-full-app/app
          VISUAL_CUE_LIVE_URL=http://127.0.0.1:8765/dist/visual-cue-full-app/app/ node scripts/visual-cue/test_live_app_browser.mjs
          VISUAL_CUE_UI_BASE=http://127.0.0.1:8765 node scripts/visual-cue/test_ui_browser.mjs
          node scripts/visual-cue/test_scene_motion.mjs
          python scripts/visual-cue/verify_scene_motion.py
          python scripts/visual-cue/verify_hug_face_motion.py
          node test-visual-cue-ui.mjs
          node test-visual-cue-coverage.mjs
          VISUAL_CUE_TRIAL_BASE=http://127.0.0.1:8765 node scripts/visual-cue/test_trial_browser.mjs
          node scripts/visual-cue/capture_preview.mjs
          VISUAL_CUE_PREVIEW_URL="file://$PWD/assets/visual-cue/artwork/preview-offline.html" node scripts/visual-cue/capture_preview.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-cue-raster-review
          path: |
            assets/emma-gestures/qa/
            assets/emma-background-cues/qa/
            assets/visual-cue/trial-qa/
            assets/visual-cue/live-app-qa/
            assets/visual-cue/motion-variants/qa/
            assets/visual-cue/prototypes/hug-face/qa/
            assets/visual-cue/artwork/qa/
            assets/visual-cue/artwork/preview.*
            assets/visual-cue/artwork/preview-offline.html
            assets/visual-cue/artwork/manifest.json
            assets/visual-cue/artwork/COVERAGE.md
          retention-days: 14
