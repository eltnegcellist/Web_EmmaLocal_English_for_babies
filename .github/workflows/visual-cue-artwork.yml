name: Visual Cue raster artwork review
on:
  pull_request:
    paths:
      - 'assets/visual-cue/artwork/**'
      - 'scripts/visual-cue/**'
      - '.github/workflows/visual-cue-artwork.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  raster-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/visual-cue/requirements.txt
      - run: python scripts/verify-visual-cue-handoff.py
      - run: python scripts/visual-cue/audit_scene_usage.py
      - run: python scripts/visual-cue/validate_artwork.py
      - run: python scripts/visual-cue/report_artwork.py
      - run: python scripts/visual-cue/export_preview.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Capture standalone review, controls and reduced motion
        run: |
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/visual-cue-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          node scripts/visual-cue/capture_preview.mjs
          VISUAL_CUE_PREVIEW_URL="file://$PWD/assets/visual-cue/artwork/preview-offline.html" node scripts/visual-cue/capture_preview.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-cue-raster-review
          path: |
            assets/visual-cue/artwork/qa/
            assets/visual-cue/artwork/preview.*
            assets/visual-cue/artwork/preview-offline.html
            assets/visual-cue/artwork/manifest.json
            assets/visual-cue/artwork/COVERAGE.md
          retention-days: 14
