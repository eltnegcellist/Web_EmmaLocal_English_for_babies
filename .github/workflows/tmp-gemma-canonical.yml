name: Temporary Gemma canonical generation
# docker-server-v1

on:
  push:
    branches:
      - "tmp/gemma-canonical-20260922"
    paths:
      - ".github/workflows/tmp-gemma-canonical.yml"
      - "tmp_gemma_canonical.py"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Start Gemma
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --name emma-gemma-canonical -p 8080:8080 \
            ghcr.io/ggml-org/llama.cpp:server \
            -hf ggml-org/gemma-4-E2B-it-GGUF:Q4_0 \
            --reasoning off --host 0.0.0.0 --port 8080 --ctx-size 4096 --threads 4 \
            >/tmp/gemma.log 2>&1 &
          echo $! > /tmp/gemma.pid
          for i in $(seq 1 180); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/gemma.log
          exit 1

      - name: Generate all twenty scenes
        run: python3 tmp_gemma_canonical.py

      - name: Stop Gemma
        if: always()
        shell: bash
        run: |
          docker stop emma-gemma-canonical 2>/dev/null || true
          if [ -f /tmp/gemma.pid ]; then
            kill "$(cat /tmp/gemma.pid)" 2>/dev/null || true
          fi
