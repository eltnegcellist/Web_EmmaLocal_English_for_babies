name: Visual Cue one-time corpus refresh
on:
  push:
    branches:
      - feature/visual-cue-914-corpus-20261014
    paths:
      - .github/workflows/visual-cue-refresh-once.yml
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh all English-derived Visual Cue data
        run: |
          node scripts/build-visual-cue-data.mjs
          node scripts/test-visual-cue-data.mjs
          node scripts/validate-visual-cue-data.mjs
      - name: Commit exact latest-main corpus into branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shared/visual-cue-corpus.snapshot.json shared/visual-cue-phrases.json shared/visual-cue-assignments.draft.json shared/visual-cue-namespaces.json
          if git diff --cached --quiet; then
            echo "No update needed"
          else
            git commit -m "chore(visual-cue): regenerate data against latest English"
            git push origin HEAD:feature/visual-cue-914-corpus-20261014
          fi
